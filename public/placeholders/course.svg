<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Course placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="0.55" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- soft decorative blobs -->
  <circle cx="140" cy="120" r="220" fill="#2563EB" opacity="0.06"/>
  <circle cx="1140" cy="620" r="260" fill="#2563EB" opacity="0.05"/>

  <!-- graduation cap -->
  <g transform="translate(640 360)">
    <path d="M-180 -60 L0 -140 L180 -60 L0 20 Z" fill="#2563EB"/>
    <path d="M-180 -60 L0 20 L180 -60" fill="none" stroke="#1D4ED8" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-90 -10 L-90 60 C-90 95 90 95 90 60 L90 -10" fill="none" stroke="#1D4ED8" stroke-width="10" stroke-linecap="round"/>
    <line x1="180" y1="-60" x2="180" y2="40" stroke="#1D4ED8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="180" cy="55" r="10" fill="#1D4ED8"/>
  </g>

  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#1D4ED8" opacity="0.55">Course</text>
</svg>
